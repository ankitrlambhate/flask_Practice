name: Flask Application CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install dependencies and run tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
      SECRET_KEY: ci-only-not-used-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build application package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package application
        run: tar -czf flask-practice.tar.gz app.py templates requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flask-practice
          path: flask-practice.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy application
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'release' && github.event.action == 'published')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.event_name == 'release' && 'production' || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flask-practice

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Copy application and restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes)
          scp "${ssh_options[@]}" flask-practice.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/flask-practice-$RELEASE_ID.tar.gz"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$RELEASE_ID'" <<'REMOTE'
          set -euo pipefail
          release_id="$1"
          app_root="/opt/flask-practice"
          release_dir="$app_root/releases/$release_id"
          mkdir -p "$release_dir"
          tar -xzf "/tmp/flask-practice-$release_id.tar.gz" -C "$release_dir"
          python3 -m venv "$release_dir/.venv"
          "$release_dir/.venv/bin/pip" install -r "$release_dir/requirements.txt" gunicorn
          ln -sfn "$release_dir" "$app_root/current"
          sudo systemctl restart flask-practice
          sudo systemctl is-active --quiet flask-practice
          rm -f "/tmp/flask-practice-$release_id.tar.gz"
          REMOTE
