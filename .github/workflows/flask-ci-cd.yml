name: Flask CI/CD

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install dependencies and run tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/test_student_db
      SECRET_KEY: ci-only-not-used-for-deployment
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build deployment artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Package application
        run: |
          mkdir -p dist
          tar -czf dist/flask-practice.tar.gz app.py templates requirements.txt
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-practice-${{ github.sha }}
          path: dist/flask-practice.tar.gz
          if-no-files-found: error
          retention-days: 5

  deploy-staging:
    name: Deploy to Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-practice-${{ github.sha }}
          path: artifact
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh_options=(-i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes)
          scp "${ssh_options[@]}" artifact/flask-practice.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/flask-practice-$GITHUB_SHA.tar.gz"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          release_id="$1"
          app_root="/opt/flask-practice"
          release_dir="$app_root/releases/$release_id"
          mkdir -p "$release_dir"
          tar -xzf "/tmp/flask-practice-$release_id.tar.gz" -C "$release_dir"
          python3 -m venv "$release_dir/.venv"
          "$release_dir/.venv/bin/python" -m pip install --upgrade pip
          "$release_dir/.venv/bin/python" -m pip install -r "$release_dir/requirements.txt"
          ln -sfn "$release_dir" "$app_root/current"
          sudo systemctl restart flask-practice
          sudo systemctl is-active --quiet flask-practice
          rm -f "/tmp/flask-practice-$release_id.tar.gz"
          REMOTE_SCRIPT

  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-practice-${{ github.sha }}
          path: artifact
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh_options=(-i "$RUNNER_TEMP/ssh/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes)
          scp "${ssh_options[@]}" artifact/flask-practice.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/flask-practice-$GITHUB_SHA.tar.gz"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          release_id="$1"
          app_root="/opt/flask-practice"
          release_dir="$app_root/releases/$release_id"
          mkdir -p "$release_dir"
          tar -xzf "/tmp/flask-practice-$release_id.tar.gz" -C "$release_dir"
          python3 -m venv "$release_dir/.venv"
          "$release_dir/.venv/bin/python" -m pip install --upgrade pip
          "$release_dir/.venv/bin/python" -m pip install -r "$release_dir/requirements.txt"
          ln -sfn "$release_dir" "$app_root/current"
          sudo systemctl restart flask-practice
          sudo systemctl is-active --quiet flask-practice
          rm -f "/tmp/flask-practice-$release_id.tar.gz"
          REMOTE_SCRIPT
