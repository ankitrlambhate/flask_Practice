name: Flask Github Actions CI/CD Pipeline

on:
  push:
    branches: [main, staging]
    tags: ["v*"]
  pull_request:
    branches: [main, staging]

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

  test:
    name: Run tests
    needs: install
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest test_app.py -v

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf app.tar.gz app.py requirements.txt templates
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tar.gz

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      APP_DIR: flask_app_staging
      APP_PORT: "5000"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Deploy over SSH
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_PRIVATE_KEY" > key
          SSH=(-i key -o StrictHostKeyChecking=accept-new)
          # shellcheck disable=SC2029  # APP_DIR is meant to expand here
          printf "MONGO_URI='%s'\nSECRET_KEY='%s'\n" "$MONGO_URI" "$SECRET_KEY" \
            | ssh "${SSH[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p $APP_DIR && cat > $APP_DIR/.env"
          scp "${SSH[@]}" app.tar.gz "$SSH_USER@$SSH_HOST:$APP_DIR/"
          ssh "${SSH[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$APP_PORT" <<'EOF'
          set -e
          cd "$1"
          tar -xzf app.tar.gz
          [ -d venv ] || python3 -m venv venv
          venv/bin/pip install -q -r requirements.txt gunicorn
          if [ -f app.pid ]; then kill "$(cat app.pid)" 2>/dev/null || true; sleep 2; fi
          venv/bin/gunicorn --daemon --pid app.pid -b "0.0.0.0:$2" app:app
          EOF

  deploy-production:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      APP_DIR: flask_app_production
      APP_PORT: "8000"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Deploy over SSH
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_PRIVATE_KEY" > key
          SSH=(-i key -o StrictHostKeyChecking=accept-new)
          # shellcheck disable=SC2029  # APP_DIR is meant to expand here
          printf "MONGO_URI='%s'\nSECRET_KEY='%s'\n" "$MONGO_URI" "$SECRET_KEY" \
            | ssh "${SSH[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p $APP_DIR && cat > $APP_DIR/.env"
          scp "${SSH[@]}" app.tar.gz "$SSH_USER@$SSH_HOST:$APP_DIR/"
          ssh "${SSH[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$APP_PORT" <<'EOF'
          set -e
          cd "$1"
          tar -xzf app.tar.gz
          [ -d venv ] || python3 -m venv venv
          venv/bin/pip install -q -r requirements.txt gunicorn
          if [ -f app.pid ]; then kill "$(cat app.pid)" 2>/dev/null || true; sleep 2; fi
          venv/bin/gunicorn --daemon --pid app.pid -b "0.0.0.0:$2" app:app
          EOF
